# Release: push a tag vX.Y.Z (version in package.json and server.json must match it).
# npm is published through trusted publishing (OIDC): no NPM_TOKEN secret exists or is needed.
# The trusted publisher is configured on npmjs.com: sv-number / mcp-server / publish.yml.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC for npm trusted publishing and the MCP Registry
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: npm new enough for trusted publishing (11.5.1+)
        run: npm install -g npm@latest

      - name: Version in tag, package.json and server.json agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          SRV="$(node -p "require('./server.json').version")"
          echo "tag=$TAG package=$PKG server=$SRV"
          test "$TAG" = "$PKG" && test "$TAG" = "$SRV"

      - run: npm install
      - run: npm run build

      - name: Publish to npm
        run: npm publish --access public

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
